[package]
name = "fastcards"
version = "2.0.3"
edition = "2024"
description = "A CLI-based spaced repetition flashcard study tool"
license = "MIT"
homepage = "https://github.com/indium114/fastcards"
repository = "https://github.com/indium114/fastcards"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
demand = "2.0.3"
dirs = "7.0.0"
humantime = "2.4.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
